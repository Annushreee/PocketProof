
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketProof | Expenses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="expenses-header">
        <h1>PocketProof</h1>
        <nav>
            <a href="home.html">Home</a>
            <button type="button" id="logout-button">Log Out</button>
        </nav>
    </header>

    <main class="expenses-container">
        <section class="expense-card">
            <h2>Add Daily Expense</h2>
            <p>Record and organize your spending.</p>

            <form id="expense-form">
                <div class="expense-field">
                    <label for="expense-amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="expense-amount"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                    >
                </div>

                <div class="expense-field">
                    <label for="expense-description">Description</label>
                    <input
                        type="text"
                        id="expense-description"
                        maxlength="255"
                        placeholder="e.g. Lunch with friends"
                        required
                    >
                </div>

                <div class="expense-field">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required>
                        <option value="">Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Salary">Salary / Income</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="expense-field">
                    <label for="expense-subcategory">Subcategory</label>
                    <select id="expense-subcategory" required disabled>
                        <option value="">Select a category first</option>
                    </select>
                </div>

                <div class="expense-field" id="custom-subcategory-field" hidden>
                    <label for="custom-subcategory">Your subcategory</label>
                    <input
                        type="text"
                        id="custom-subcategory"
                        maxlength="100"
                        placeholder="Enter your own subcategory"
                    >
                </div>

                <div class="expense-field">
                    <label for="expense-date">Expense date</label>
                    <input type="date" id="expense-date" required>
                </div>

                <p id="expense-message" role="status" aria-live="polite"></p>

                <button type="submit" id="add-expense-button">
                    Add Expense
                </button>
            </form>
        </section>

        <section class="expense-card">
            <h2>Your Expenses</h2>
            <p id="expense-total">Total: ₹0.00</p>

            <div class="expense-table-wrapper">
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Subcategory</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list">
                        <tr>
                            <td colspan="6">Loading expenses...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/expenses.js"></script>
</body>
</html>

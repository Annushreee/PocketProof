
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketProof - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>PocketProof</h1>
        <p>Your money, your clarity.</p>
    </header>

    <main>
        <section id="register-section">
            <h2>Create Account</h2>

            <form id="register-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="email" required>

                <label for="register-password">Password</label>
                <input type="password" id="register-password"
                       name="password" minlength="8" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                       name="confirmPassword" minlength="8" required>

                <button type="submit">Create Account</button>
            </form>

            <p>Already have an account?
                <button type="button" id="show-login">Log In</button>
            </p>
        </section>

        <section id="login-section" hidden>
            <h2>Welcome Back</h2>

            <form id="login-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password"
                       name="password" required>

                <button type="submit">Log In</button>
            </form>

            <p>
                <button type="button" id="forgot-password">
                    Forgot Password?
                </button>
            </p>

            <p>Don't have an account?
                <button type="button" id="show-register">
                    Create Account
                </button>
            </p>
        </section>

        <section id="forgot-section" hidden>
            <h2>Reset Password</h2>

            <form id="forgot-form">
                <label for="forgot-email">Registered Email</label>
                <input type="email" id="forgot-email" name="email" required>

                <button type="submit">Send Reset Link</button>
            </form>

            <p>
                <button type="button" id="back-to-login">
                    Back to Login
                </button>
            </p>
        </section>

        <p id="message" role="status" hidden></p>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
